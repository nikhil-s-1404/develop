<input type="file" (change)="onFileSelected($event)" />

<div *ngIf="imageUrl" style="position: relative; display: inline-block;">
  <img [src]="imageUrl" style="width: 500px;" />

  <!-- Draw each annotation -->
  <div *ngFor="let ann of annotations"
       [style.left.px]="ann.x"
       [style.top.px]="ann.y"
       [style.width.px]="ann.width"
       [style.height.px]="ann.height"
       style="position: absolute; border: 2px solid red; background: rgba(255,0,0,0.1);">
  </div>

  <!-- Optional: Label -->
  <div *ngFor="let ann of annotations"
       [style.left.px]="ann.x"
       [style.top.px]="ann.y - 20"
       style="position: absolute; color: white; background: red; padding: 2px 6px; font-size: 12px; border-radius: 4px;">
    {{ ann.label }} ({{ ann.confidence * 100 | number:'1.0-0' }}%)
  </div>
</div>
